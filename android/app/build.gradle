plugins { id 'com.android.application' }

android {
    namespace 'com.itzvalen.cajakiosco'
    compileSdk 35
    defaultConfig {
        applicationId 'com.itzvalen.cajakiosco'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('web')
}

// La app es el mismo index.html de la raíz del repo: se copia al APK al compilar.
tasks.register('copyWeb', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'manifest.webmanifest', 'logo.svg', 'icon-*.png', 'apple-touch-icon.png'
    }
    into layout.buildDirectory.dir('web')
}
preBuild.dependsOn 'copyWeb'

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
